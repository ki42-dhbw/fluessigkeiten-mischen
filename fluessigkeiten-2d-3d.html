    '2d': "<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, user-scalable=no\">\n<title>Flüssigkeiten mischen</title>\n<style>\n  :root {\n    --ink: #1b2530;\n    --ink-soft: #5a6878;\n    --panel: rgba(255, 255, 255, 0.84);\n    --line: rgba(20, 35, 55, 0.12);\n    --accent: #0a6fd6;\n  }\n  * { box-sizing: border-box; }\n  html, body {\n    margin: 0; height: 100%; overflow: hidden;\n    background: #eef2f6; color: var(--ink);\n    font: 14px/1.4 system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;\n  }\n  #tank {\n    position: fixed; inset: 0; width: 100%; height: 100%;\n    display: block; touch-action: none; cursor: crosshair;\n  }\n  #ring {\n    position: fixed; left: 0; top: 0; pointer-events: none;\n    border: 1.5px solid rgba(255, 255, 255, 0.95);\n    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45);\n    border-radius: 50%; transform: translate(-50%, -50%);\n    display: none;\n  }\n\n  #panel {\n    position: fixed; top: 14px; left: 14px; width: 264px;\n    max-height: calc(100% - 28px); overflow: auto;\n    background: var(--panel);\n    -webkit-backdrop-filter: blur(14px) saturate(1.3);\n    backdrop-filter: blur(14px) saturate(1.3);\n    border: 1px solid var(--line); border-radius: 14px;\n    box-shadow: 0 10px 34px rgba(15, 30, 50, 0.2);\n    user-select: none; -webkit-user-select: none;\n  }\n  #panel header {\n    display: flex; align-items: center; justify-content: space-between;\n    padding: 12px 14px;\n  }\n  #panel h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: 0.01em; }\n  #toggle {\n    border: 0; background: none; cursor: pointer; color: var(--ink-soft);\n    width: 28px; height: 28px; border-radius: 8px; font-size: 16px; line-height: 1;\n  }\n  #toggle:hover { background: rgba(20, 35, 55, 0.08); }\n  #body { padding: 0 14px 14px; }\n  /* nicht display:none – das Kamerabild muss (v. a. in Safari) weiterlaufen */\n  #panel.closed #body { height: 0; padding: 0; overflow: hidden; }\n  #panel.closed { width: auto; }\n\n  .label {\n    font-size: 11px; font-weight: 650; text-transform: uppercase;\n    letter-spacing: 0.07em; color: var(--ink-soft); margin: 14px 0 7px;\n  }\n  .label:first-child { margin-top: 2px; }\n\n  .swatches { display: flex; gap: 9px; align-items: center; }\n  .sw {\n    width: 38px; height: 38px; border-radius: 50%; padding: 0; cursor: pointer;\n    border: 2px solid #fff; outline: 1px solid var(--line);\n    box-shadow: inset 0 -5px 9px rgba(0, 0, 0, 0.16);\n    transition: transform 0.12s;\n  }\n  .sw:hover { transform: scale(1.06); }\n  .sw[aria-checked=\"true\"] { outline: 2.5px solid var(--ink); outline-offset: 2px; }\n  .sw.water {\n    background:\n      radial-gradient(circle at 35% 30%, #fff 0 18%, transparent 19%),\n      linear-gradient(160deg, #f6fbff, #d8eaf8);\n  }\n  .pick {\n    margin-left: auto; display: flex; align-items: center; gap: 6px;\n    font-size: 12px; color: var(--ink-soft);\n  }\n  .pick input {\n    width: 34px; height: 28px; padding: 0; border: 1px solid var(--line);\n    border-radius: 7px; background: #fff; cursor: pointer;\n  }\n  .pick input:disabled { opacity: 0.35; cursor: default; }\n\n  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }\n  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }\n  .seg3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }\n  button.b {\n    font: inherit; font-size: 13px; color: var(--ink); cursor: pointer;\n    padding: 8px 6px; border-radius: 9px;\n    border: 1px solid var(--line); background: rgba(255, 255, 255, 0.75);\n  }\n  button.b:hover { background: #fff; border-color: rgba(20, 35, 55, 0.28); }\n  button.b[aria-pressed=\"true\"] {\n    background: var(--ink); color: #fff; border-color: var(--ink);\n  }\n\n  .slider { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 8px; margin: 7px 0; }\n  .slider span { font-size: 13px; }   <button class=\"sw\" data-i=\"1\" role=\"radio\" aria-checked=\"false\" title=\"Flüssigkeit B (Taste 2)\"></button>\n      <button class=\"sw\" data-i=\"2\" role=\"radio\" aria-checked=\"false\" title=\"Flüssigkeit C (Taste 3)\"></button>\n      <button class=\"sw water\" data-i=\"3\" role=\"radio\" aria-checked=\"false\" title=\"Klares Wasser zum Verdünnen (Taste 4)\"></button>\n      <label class=\"pick\" title=\"Farbe der gewählten Flüssigkeit ändern\">Farbe\n        <input type=\"color\" id=\"colorPick\" value=\"#0a8cf2\">\n      </label>\n    </div>\n\n    <div class=\"label\">Werkzeug</div>\n    <div class=\"seg\">\n      <button class=\"b\" id=\"toolPour\" aria-pressed=\"true\">Einfüllen</button>\n      <button class=\"b\" id=\"toolStir\" aria-pressed=\"false\">Rühren</button>\n    </div>\n\n    <div class=\"label\">Modi – an / aus</div>\n    <div class=\"seg3\">\n      <button class=\"b\" id=\"modeMouse\" aria-pressed=\"true\" title=\"Reaktion auf Maus und Touch\">Maus</button>\n      <button class=\"b\" id=\"auto\" aria-pressed=\"false\" title=\"Ein unsichtbarer Rührstab rührt von selbst\">Automatik</button>\n      <button class=\"b\" id=\"modeAudio\" aria-pressed=\"false\" title=\"Reaktion auf Ton\">Audio</button>\n    </div>\n    <div class=\"label\" id=\"camModesLabel\">Kamera-Modi – an / aus</div>\n    <div class=\"grid2\">\n      <button class=\"b\" id=\"modeCam\" aria-pressed=\"false\" title=\"Bewegungen vor der Kamera schieben die Flüssigkeit\">Bewegung</button>\n      <button class=\"b\" id=\"modeOutline\" aria-pressed=\"false\" title=\"Die Umrisse des Kamerabilds werden grob gezeichnet und verwischen\">Umrisse</button>\n    </div>\n    <div class=\"status\" id=\"audioStatus\" role=\"status\"></div>\n    <div class=\"status\" id=\"camStatus\" role=\"status\"></div>\n\n    <div id=\"audioBox\" hidden>\n      <div class=\"label\">Audioquelle</div>\n      <select class=\"sel\" id=\"audioSrc\" aria-label=\"Audioquelle wählen\">\n        <optgroup label=\"Mikrofon / Eingang\" id=\"micGroup\">\n          <option value=\"mic:\">Standard-Mikrofon</option>\n        </optgroup>\n        <optgroup label=\"Weitere Quellen\" id=\"otherGroup\">\n          <option value=\"system\">System- oder Tab-Ton …</option>\n          <option value=\"file\">Audiodatei öffnen …</option>\n        </optgroup>\n      </select>\n      <div id=\"meter\" aria-hidden=\"true\"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>\n      <label class=\"slider\"><span>Empfindlichkeit</span>\n        <input type=\"range\" id=\"sens\" min=\"0.3\" max=\"4\" step=\"0.1\" value=\"1\"></label>\n      <button class=\"b wide\" id=\"audioColor\" aria-pressed=\"true\" title=\"Bei lauten Stellen wird zusätzlich Farbe eingespritzt\">Farbe im Takt einspritzen</button>\n    </div>\n    <input type=\"file\" id=\"audioFile\" accept=\"audio/*,video/*\" hidden>\n\n    <div id=\"camBox\" hidden>\n      <div class=\"label\">Kamera</div>\n      <select class=\"sel\" id=\"camSrc\" aria-label=\"Kamera wählen\">\n        <option value=\"\">Standard-Kamera</option>\n      </select>\n      <video id=\"camVideo\" muted playsinline></video>\n      <div id=\"motionBox\" hidden>\n        <div class=\"label\">Bewegung</div>\n        <label class=\"slider\"><span>Empfindlichkeit</span>\n          <input type=\"range\" id=\"camSens\" min=\"0.3\" max=\"4\" step=\"0.1\" value=\"1\"></label>\n        <div class=\"label\">Farbe bei Bewegung</div>\n        <div class=\"seg3\" id=\"camColorSeg\">\n          <button class=\"b\" data-cc=\"off\" aria-pressed=\"true\" title=\"Bewegung schiebt die Flüssigkeit nur\">Aus</button>\n          <button class=\"b\" data-cc=\"pick\" aria-pressed=\"false\" title=\"Wo sich etwas bewegt, wird die oben gewählte Flüssigkeit eingespritzt\">Gewählte</button>\n          <button class=\"b\" data-cc=\"random\" aria-pressed=\"false\" title=\"Wo sich etwas bewegt, werden zufällige, ständig wechselnde Farben eingespritzt\">Zufall</button>\n        </div>\n      </div>\n      <div id=\"outlineBox\" hidden>\n        <div class=\"label\">Umrisse – Stil</div>\n        <div class=\"seg3\" id=\"outlineSeg\">\n          <button class=\"b\" data-os=\"ink\" aria-pressed=\"true\" title=\"Dunkle Tuschelinien über der Flüssigkeit, die verwischen und verblassen\">Tusche</button>\n          <button class=\"b\" data-os=\"glow\" aria-pressed=\"false\" title=\"Bunt leuchtende Linien, Farbe je nach Richtung der Kante\">Leuchten</button>\n          <button class=\"b\" data-os=\"dye\" aria-pressed=\"false\" title=\"Die Umrisse werden mit der gewählten Flüssigkeit dauerhaft ins Becken gemalt\">Einfärben</button>\n        </div>\n        <label class=\"slider\"><span>Verwischen</span>\n          <input type=\"range\" id=\"outSmear\" min=\"0\" max=\"1\" step=\"0.02\" value=\"0.5\"></label>\n        <label class=\"slider\"><span>Detail</span>\n          <input type=\"range\" id=\"outDetail\" min=\"0\" max=\"1\" step=\"0.02\" value=\"0.6\"></label>\n      </div>\n    </div>\n\n    <div class=\"label\">Einstellungen</div>\n    <label class=\"slider\"><span>Pinselgröße</span>\n      <input type=\"range\" id=\"brush\" min=\"0.015\" max=\"0.16\" step=\"0.005\" value=\"0.05\"></label>\n    <label class=\"slider\"><span>Zähigkeit</span>\n      <input type=\"range\" id=\"visc\" min=\"0\" max=\"3\" step=\"0.05\" value=\"0.35\"></label>\n    <label class=\"slider\"><span>Wirbel</span>\n      <input type=\"range\" id=\"curl\" min=\"0\" max=\"40\" step=\"1\" value=\"14\"></label>\n\n    <div class=\"label\">Startbild</div>\n    <div class=\"grid2\">\n      <button class=\"b\" data-preset=\"0\">Zwei Hälften</button>\n      <button class=\"b\" data-preset=\"1\">Schichten</button>\n      <button class=\"b\" data-preset=\"2\">Tropfen</button>\n      <button class=\"b\" data-preset=\"3\">Nur Wasser</button>\n    </div>\n\n    <button class=\"b wide\" id=\"pause\" aria-pressed=\"false\" style=\"margin-top:6px\">Pause</button>\n\n    <p class=\"hint\">\ n highp float;\nattribute vec2 aPosition;\nuniform vec2 texelSize;\nvarying vec2 vUv;\nvarying vec2 vL;\nvarying vec2 vR;\nvarying vec2 vT;\nvarying vec2 vB;\nvoid main () {\n  vUv = aPosition * 0.5 + 0.5;\n  vL = vUv - vec2(texelSize.x, 0.0);\n  vR = vUv + vec2(texelSize.x, 0.0);\n  vT = vUv + vec2(0.0, texelSize.y);\n  vB = vUv - vec2(0.0, texelSize.y);\n  gl_Position = vec4(aPosition, 0.0, 1.0);\n}`;\n\nconst FRAG_HEAD = `\n#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\nprecision highp sampler2D;\n#else\nprecision mediump float;\nprecision mediump sampler2D;\n#endif\nvarying vec2 vUv;\nvarying vec2 vL;\nvarying vec2 vR;\nvarying vec2 vT;\nvarying vec2 vB;\n`;\n\nconst FRAG_COPY = `\nuniform sampler2D uTex;\nuniform float uScale;\nvoid main () {\n  gl_FragColor = uScale * texture2D(uTex, vUv);\n}`;\n\n// Startbilder: Werte sind Absorptionen (0 = klares Wasser)\nconst FRAG_INIT = `\nuniform float uMode;\nuniform float uAspect;\nuniform vec3 uA;\nuniform vec3 uB;\nuniform vec3 uC;\nfloat disc (vec2 c, float r) {\n  vec2 p = (vUv - c) * vec2(uAspect, 1.0);\n  return 1.0 - smoothstep(r * 0.9, r, length(p));\n}\nvoid main () {\n  vec3 d = vec3(0.0);\n  if (uMode < 0.5) {\n    d = mix(uA, uB, smoothstep(0.497, 0.503, vUv.x));\n  } else if (uMode < 1.5) {\n    d = mix(uC, uB, smoothstep(0.330, 0.336, vUv.y));\n    d = mix(d, uA, smoothstep(0.664, 0.670, vUv.y));\n  } else if (uMode < 2.5) {\n    d = mix(d, uA, disc(vec2(0.25, 0.62), 0.17));\n    d = mix(d, uB, disc(vec2(0.50, 0.36), 0.17));\n    d = mix(d, uC, disc(vec2(0.75, 0.62), 0.17));\n  }\n  gl_FragColor = vec4(d, 1.0);\n}`;\n\n// Pinselstrich als \"Kapsel\" zwischen zwei Punkten: mischt den Zielwert ein\nconst FRAG_SPLAT = `\nuniform sampler2D uTarget;\nuniform vec2 uA;\nuniform vec2 uB;\nuniform float uAspect;\nuniform float uRadius;\nuniform float uHard;\nuniform float uStrength;\nuniform vec3 uValue;\nvoid main () {\n  vec2 asp = vec2(uAspect, 1.0);\n  vec2 pa = (vUv - uA) * asp;\n  vec2 ba = (uB - (p, vec3(0.50, 0.80, 0.26), 0.12));\n  } else if (uMode == 1) {\n    d = mix(uA, uB, smoothstep(0.47, 0.53, p.x)) * 0.3;\n  } else if (uMode == 2) {\n    float wave = 0.02 * sin(p.x * 19.0) * sin(p.z * 15.0);\n    d = uA * 0.35 * (1.0 - smoothstep(0.30, 0.34, p.y));\n    d = mix(d, uB * 0.4, smoothstep(0.68, 0.72, p.y + wave));\n  }\n  outColor = vec4(d, 1.0);\n}`;\n\n// Pinselstrich als Kapsel zwischen zwei Punkten im Raum\nconst FRAG_SPLAT = `\nuniform sampler2D uTarget;\nuniform vec3 uA;\nuniform vec3 uB;\nuniform vec3 uValue;\nuniform float uRadius;\nuniform float uHard;\nuniform float uStrength;\nvoid main () {\n  vec3 p = vec3(voxel()) + 0.5;\n  vec3 pa = p - uA;\n  vec3 ba = uB - uA;\n  float h = clamp(dot(pa, ba) / max(dot(ba, ba), 0.000001), 0.0, 1.0);\n  float d = length(pa - ba * h) / uRadius;\n  float g = mix(exp(-d * d), 1.0 - smoothstep(0.7, 1.0, d), uHard);\n  vec3 base = self(uTarget).xyz;\n  outColor = vec4(mix(base, uValue, clamp(g * uStrength, 0.0, 1.0)), 1.0);\n}`;\n\nconst FRAG_ADVECT = `\nuniform sampler2D uVel;\nuniform sampler2D uSrc;\nuniform float uDt;\nuniform float uDissipation;\nvoid main () {\n  vec3 p = vec3(voxel()) + 0.5;\n  vec3 v = self(uVel).xyz;\n  outColor = sample3(uSrc, p - uDt * v) / (1.0 + uDissipation * abs(uDt));\n}`;\n\n// MacCormack-Korrektur: hält Farbkanten deutlich schärfer als einfache Advektion\nconst FRAG_MACCORMACK = `\nuniform sampler2D uVel;\nuniform sampler2D uOrig;\nuniform sampler2D uFwd;\nuniform sampler2D uBack;\nuniform float uDt;\nvoid main () {\n  vec3 p = vec3(voxel()) + 0.5;\n  vec3 q = p - uDt * self(uVel).xyz;\n  vec4 r = self(uFwd) + 0.5 * (self(uOrig) - self(uBack));\n  ivec3 b = ivec3(floor(clamp(q, vec3(0.5), vec3(float(uN) - 0.5)) - 0.5));\n  vec4 mn = fetch3(uOrig, b);\n  vec4 mx = mn;\n  for (int i = 1; i < 8; i++) {\n    vec4 s = fetch3(uOrig, b + ivec3(i & 1, (i >> 1) & 1, (i >> 2) & 1));\n    mn = min(mn, s);\n    mx = max(mx, s);\n  }\n  outColor = clamp(r, mn, mx);\n}`;\n\nconst FRAG_CURL \nuniform sampler2D uDivergence;\nvoid main () {\n  ivec3 c = voxel();\n  float s = fetch3(uPressure, c - ivec3(1, 0, 0)).x + fetch3(uPressure, c + ivec3(1, 0, 0)).x\n          + fetch3(uPressure, c - ivec3(0, 1, 0)).x + fetch3(uPressure, c + ivec3(0, 1, 0)).x\n          + fetch3(uPressure, c - ivec3(0, 0, 1)).x + fetch3(uPressure, c + ivec3(0, 0, 1)).x;\n  outColor = vec4((s - self(uDivergence).x) / 6.0, 0.0, 0.0, 1.0);\n}`;\n\nconst FRAG_GRADIENT = `\nuniform sampler2D uPressure;\nuniform sampler2D uVel;\nvoid main () {\n  ivec3 c = voxel();\n  int m = uN - 1;\n  vec3 g = 0.5 * vec3(\n    fetch3(uPressure, c + ivec3(1, 0, 0)).x - fetch3(uPressure, c - ivec3(1, 0, 0)).x,\n    fetch3(uPressure, c + ivec3(0, 1, 0)).x - fetch3(uPressure, c - ivec3(0, 1, 0)).x,\n    fetch3(uPressure, c + ivec3(0, 0, 1)).x - fetch3(uPressure, c - ivec3(0, 0, 1)).x);\n  vec3 v = self(uVel).xyz - g;\n  if (c.x == 0 || c.x == m) v.x = 0.0;\n  if (c.y == 0 || c.y == m) v.y = 0.0;\n  if (c.z == 0 || c.z == m) v.z = 0.0;\n  outColor = vec4(v, 1.0);\n}`;\n\n// Kamera: 2D-Bewegungsfeld wirkt von der Vorderseite des Beckens aus\nconst FRAG_FIELD = `\nuniform sampler2D uTarget;\nuniform sampler2D uFlow;\nuniform sampler2D uPalette;\nuniform vec2 uVelScale;\nuniform vec3 uColor;\nuniform float uRandom;\nuniform float uDyeMode;\nuniform float uBias;\nuniform float uGain;\nvoid main () {\n  vec3 p = (vec3(voxel()) + 0.5) / float(uN);\n  vec4 f = texture(uFlow, p.xy);\n  vec3 base = self(uTarget).xyz;\n  vec2 v = (f.xy * 255.0 - 128.0) / 127.0 * uVelScale;\n  vec3 rnd = -log(max(texture(uPalette, p.xy).rgb, vec3(0.03)));\n  vec3 target = mix(vec3(v, 0.0), mix(uColor, rnd, uRandom), uDyeMode);\n  float push = smoothstep(0.15, 0.85, p.z);\n  float band = smoothstep(0.45, 0.6, p.z) * (1.0 - smoothstep(0.75, 0.9, p.z));\n  float s = clamp((mix(f.a, f.b, uDyeMode) - uBias) * uGain, 0.0, 1.0) * mix(push, band, uDyeMode);\n  outColor = vec4(mix(base, target, s), 1.0);\n}`;\n\n// Darstellung: Strahl durch das Becken, Tinte absorbiert und streut Licht\nconst FRAG_VOLUME = `\nuniform sampler2D uDye;\nuniform vec3 uCamPos;\nuniform mat3 uCam;\nuniform float uTanHalf;\nuniform float uAspect;\nuniform int uSteps;\nuniform vec3 uLightVox;\nfloat hash (vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }\nvoid main () {\n  vec3 rd = normalize(uCam[2] + vUv.x * uAspect * uTanHalf * uCam[0] + vUv.y * uTanHalf * uCam[1]);\n  vec3 bg = mix(vec3(0.80, 0.84, 0.89), vec3(0.96, 0.97, 0.985), smoothstep(-1.0, 0.9, vUv.y));\n  bg *= 1.0 - 0.10 * dot(vUv, vUv);\n\n  vec3 inv = 1.0 / rd;\n  vec3 ta = (vec3(-0.5) - uCamPos) * inv;\n  vec3 tb = (vec3(0.5) - uCamPos) * inv;\n  vec3 t0 = min(ta, tb);\n  vec3 t1 = max(ta, tb);\n  float tn = max(max(t0.x, t0.y), max(t0.z, 0.0));\n  float tf = min(min(t1.x, t1.y), t1.z);\n  if (tn >= tf) { outColor = vec4(bg, 1.0); return; }\n\n  float n = float(uN);\n  float ds = 1.7321 / float(uSteps);\n  float k = 6.0 * ds;                       // optische Dichte je Schritt\n  vec3 T = vec3(1.0);\n  vec3 col = vec3(0.0);\n  float t = tn + ds * hash(gl_FragCoord.xy);\n  for (int i = 0; i < 200; i++) {\n    if (i >= uSteps || t > tf) break;\n    vec3 q = (uCamPos + rd * t + 0.5) * n;\n    vec3 a = sample3(uDye, q).rgb;\n    float d = (a.r + a.g + a.b) * 0.3333;\n    if (d > 0.003) {\n      float d2 = dot(sample3(uDye, q + uLightVox).rgb, vec3(0.3333));\n      float lit = clamp(0.78 + 1.5 * (d - d2), 0.35, 1.3);\n      vec3 pig = exp(-1.2 * a / d);          // Farbton des Gemischs (subtraktiv)\n      float sc = d * k * 0.9;\n      col += T * (1.0 - exp(-sc)) * pig * lit;\n      T *= exp(-(a * k * 0.8 + sc));\n      if (max(T.r, max(T.g, T.b)) < 0.01) break;\n    }\n    t += ds;\n  }\n  vec3 tint = vec3(0.965, 0.98, 0.995);     // das Wasser selbst ganz leicht sichtbar\n  outColor = vec4(bg * tint * T + col, 1.0);\n}`;\n\nconst VERT_LINES = `#version 300 es\nlayout(location = 0) in vec3 aPos;\nuniform vec3 uCamPos;\nuniform mat3 uCam;\nuniform float uTanHalf;\nuniform float uAspect;\nvoid main () {\n  vec3 d = aPos - uCamPos;\n  float z = dot(d, uCam[2]);\n  gl_Position = vec4(dot(d, uCam[0]) / (uTanHalf * uAspect), dot(d, uCam[1]) / uTanHalf, 0.0, z);\n}`;\nconst FRAG_LINES = `#version 300 es\nprecision mediump float;\nout vec4 outColor;\nvoid main () { outColor = vec4(0.12, 0.17, 0.23, 0.42); }`;\n\nfunction compile(type, src) {\n  const s = gl.createShader(type);\n  gl.shaderSource(s, src);\n  gl.compileShader(s);\n  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) || 'Shader-Fehler');\n  return s;\n}\nfunction link(vs, fs) {\n  const p = gl.createProgram();\n  gl.attachShader(p, vs);\n  gl.attachShader(p, fs);\n  gl.linkProgram(p);\n  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p) || 'Link-Fehler');\n  const u = {};\n  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);\n  for (let i = 0; i < n; i++) {\n    const name = gl.getActiveUniform(p, i).name.replace(/\\[0\\]$/, '');\n    u[name] = gl.getUniformLocation(p, name);\n  }\n  return { p, u };\n}\n\nlet P;\ntry {\n  const vs = compile(gl.VERTEX_SHADER, VERT);\n  const sim = src => link(vs, compile(gl.FRAGMENT_SHADER, HEAD + src));\n  P = {\n    init: sim(FRAG_INIT), splat: sim(FRAG_SPLAT), advect: sim(FRAG_ADVECT), mac: sim(FRAG_MACCORMACK),\n    curl: sim(FRAG_CURL), forces: sim(FRAG_FORCES), divergence: sim(FRAG_DIVERGENCE),\n    pressure: sim(FRAG_PRESSURE), gradient: sim(FRAG_GRADIENT), field: sim(FRAG_FIELD), volume: sim(FRAG_VOLUME),\n    lines: link(compile(gl.VERTEX_SHADER, VERT_LINES), compile(gl.FRAGMENT_SHADER, FRAG_LINES))\n  };\n} catch (err) {\n  console.error(err);\n  fail();\n  return;\n}\n\n// Geometrie: Vollbild-Rechteck und die 12 Kanten des Beckens\nconst quadVAO = gl.createVertexArray();\ngl.bindVertexArray(quadVAO);\ngl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());\ngl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1,
